<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Behind the Filter - a bilingual Media and Information Literacy investigation game.">
  <title>Behind the Filter | Case 001</title>
  <style>
    :root {
      --ink: #eef2f8;
      --muted: #a5adba;
      --dim: #6f7c90;
      --black: #020407;
      --panel: #080d14;
      --panel-2: #0d131c;
      --navy: #081532;
      --line: #596270;
      --line-soft: #273448;
      --blue: #74a2ff;
      --blue-strong: #3f78e3;
      --blue-pale: #a9c8ff;
      --green: #65c88b;
      --yellow: #e2b94e;
      --red: #e45a5a;
      --paper: #d7d9dc;
      --shadow: 0 0 0 1px #111923, 0 12px 36px #000b;
      --mono: "Courier New", Consolas, "Microsoft YaHei", monospace;
      --sans: Arial, "Microsoft YaHei", sans-serif;
      --display: Impact, "Arial Narrow", "Microsoft YaHei", sans-serif;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; overflow-x: hidden; background: var(--black); }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--black);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 15px;
      letter-spacing: 0;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 1000;
      pointer-events: none;
      opacity: .18;
      background: repeating-linear-gradient(0deg, transparent 0 3px, #ffffff0b 4px);
      mix-blend-mode: screen;
    }

    button, input { font: inherit; letter-spacing: 0; }

    button, [role="button"] { -webkit-tap-highlight-color: transparent; }

    button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--blue-pale);
      outline-offset: 3px;
    }

    h1[tabindex="-1"]:focus { outline: none; }

    button:disabled { cursor: not-allowed; opacity: .48; }

    a { color: inherit; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .icon {
      width: 1.05em;
      height: 1.05em;
      flex: 0 0 auto;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .shell {
      width: min(1440px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      border-inline: 1px solid #222b38;
      background: #030609;
    }

    .topbar {
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 12px 30px;
      border-bottom: 1px solid var(--line);
      background: #061029;
      box-shadow: inset 0 -3px 0 #020711;
    }

    .brand {
      display: flex;
      align-items: baseline;
      min-width: 0;
      gap: 16px;
    }

    .brand-mark {
      font-family: var(--sans);
      font-size: 30px;
      font-weight: 900;
      line-height: 1;
      color: #f4f5f8;
    }

    .brand-rule { color: #9ba8b9; }

    .brand-name {
      color: #c1c8d5;
      overflow-wrap: anywhere;
    }

    .top-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tool-button, .text-button, .primary-button, .secondary-button, .danger-button {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 0;
      color: var(--ink);
      background: #05090f;
      cursor: pointer;
      transition: background-color .14s ease, border-color .14s ease, color .14s ease, transform .14s ease;
    }

    .tool-button:hover, .text-button:hover, .secondary-button:hover {
      border-color: var(--blue);
      color: var(--blue-pale);
      background: #0a1426;
    }

    .tool-button {
      width: 42px;
      display: inline-grid;
      place-items: center;
      padding: 0;
      color: var(--blue-pale);
    }

    .text-button, .primary-button, .secondary-button, .danger-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 10px 16px;
      text-transform: uppercase;
    }

    .primary-button {
      min-height: 50px;
      border-color: #b4cdfa;
      box-shadow: inset 0 0 0 3px #3565bb, inset 0 -4px 0 #274a8a;
      color: #050a11;
      background: #79a4ef;
      font-weight: 900;
    }

    .primary-button:hover {
      border-color: #edf4ff;
      color: #02050a;
      background: #a9c7fa;
      transform: translateY(-1px);
    }

    .secondary-button { color: var(--blue-pale); }

    .danger-button { border-color: #8c4141; color: #ff9e9e; }

    .page-meta {
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 30px;
      border-bottom: 1px solid #343b45;
      color: #bdc3cc;
      background: #030506;
    }

    .page-meta .page-number { color: var(--blue); }

    .page-main { padding: 28px 30px 32px; }

    .scene-heading {
      margin: 0;
      color: #f1f2f4;
      font-family: var(--display);
      font-size: 50px;
      font-weight: 900;
      line-height: .98;
      text-transform: uppercase;
    }

    .scene-subtitle { margin: 8px 0 0; color: var(--blue); }

    .scene-rule {
      margin: 12px 0 18px;
      border: 0;
      border-top: 1px dotted #69717c;
    }

    .case-stamp {
      display: inline-flex;
      align-items: center;
      min-height: 46px;
      padding: 8px 16px;
      border: 1px solid #788291;
      box-shadow: inset 0 0 0 3px #0d1420;
      color: #c5d7f8;
      background: #071127;
      font-size: 18px;
    }

    .system-footer {
      display: grid;
      grid-template-columns: 1fr 1.1fr 1.25fr 1fr;
      border-top: 1px solid var(--line);
      background: #071431;
    }

    .footer-cell {
      min-width: 0;
      min-height: 112px;
      padding: 18px 28px;
      border-right: 1px dotted #6c7480;
      color: #b7bfcb;
      line-height: 1.55;
    }

    .footer-cell:last-child { border-right: 0; }
    .footer-label { display: block; margin-bottom: 6px; color: var(--blue); }
    .footer-small { color: #939cab; font-size: 12px; }

    .evidence-counter {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      padding: 6px 10px;
      border: 1px solid #40506c;
      color: #bdc8d9;
      white-space: nowrap;
    }

    .evidence-counter strong { color: var(--blue); }

    /* P00 */
    .boot-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 70px 24px 38px;
      background: #010302;
    }

    .boot-controls {
      position: fixed;
      top: 18px;
      right: 20px;
      z-index: 5;
      display: flex;
      gap: 8px;
    }

    .boot-terminal {
      width: min(980px, 100%);
      min-height: 570px;
      padding: 42px 48px;
      border: 1px solid #294038;
      box-shadow: 0 0 38px #173c2622, inset 0 0 70px #07140c;
      background: #020604;
    }

    .boot-status {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 18px;
      border-bottom: 1px solid #183426;
      color: #789587;
      font-size: 13px;
    }

    .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 8px;
      border-radius: 50%;
      background: #43b06e;
      box-shadow: 0 0 9px #43b06e;
    }

    .boot-copy {
      min-height: 360px;
      padding: 34px 0 24px;
      color: #bec8c1;
      font-size: 19px;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .boot-copy .cursor, .terminal-cursor {
      display: inline-block;
      width: 9px;
      height: 1.05em;
      margin-left: 4px;
      vertical-align: -.16em;
      background: #65c88b;
      animation: blink 1s steps(1, end) infinite;
    }

    .boot-action { display: flex; justify-content: flex-end; border-top: 1px solid #183426; padding-top: 20px; }
    .boot-action[hidden] { display: none; }

    @keyframes blink { 50% { opacity: 0; } }

    /* P01 */
    .home-main {
      min-height: calc(100vh - 72px - 112px);
      display: grid;
      grid-template-columns: minmax(360px, .78fr) minmax(540px, 1.22fr);
      gap: 54px;
      align-items: center;
      padding: 38px 46px;
    }

    .home-copy { min-width: 0; }
    .home-kicker { margin: 24px 0 10px; color: var(--blue); }
    .home-title {
      margin: 0;
      color: #f0f1f2;
      font-family: var(--display);
      font-size: 92px;
      font-weight: 900;
      line-height: .92;
      text-transform: uppercase;
      text-shadow: 3px 3px 0 #6f7680;
      overflow-wrap: anywhere;
    }

    .home-stat { margin: 28px 0 0; color: #c5c9d0; font-size: 20px; }
    .home-stat strong { color: var(--blue); font-size: 30px; }
    .home-desc { margin: 8px 0 24px; padding-bottom: 22px; border-bottom: 1px dotted #555f6b; color: #9ca4b0; }

    .retro-player {
      position: relative;
      min-width: 0;
      border: 1px solid #8a929e;
      padding: 42px 8px 48px;
      background: #020406;
      box-shadow: var(--shadow);
    }

    .player-titlebar, .player-metadata {
      position: absolute;
      left: 8px;
      right: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      color: #b6bdc8;
    }

    .player-titlebar {
      top: 7px;
      height: 30px;
      padding: 0 10px;
      border: 1px solid #263757;
      background: #0e1d42;
    }

    .player-metadata {
      bottom: 7px;
      height: 35px;
      padding: 0 10px;
      border: 1px solid #555d66;
      background: #030506;
    }

    .case-preview-art {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 1px solid #505964;
      background: #000;
      object-fit: contain;
    }

    /* Three-frame character and environmental motion for the event illustrations. */
    .art-motion {
      --art-frame-duration: 5.2s;
      --art-frame-delay: 0s;
      --art-sweep-duration: 10s;
      position: relative;
      display: block;
      overflow: hidden;
      isolation: isolate;
      background: #03070d;
    }
    .art-motion > .art-motion-image { position: relative; z-index: 0; }
    .art-motion > .art-motion-frame-b,
    .art-motion > .art-motion-frame-c {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      opacity: 0;
      pointer-events: none;
    }
    .art-motion > .art-motion-frame-b { animation: art-frame-b var(--art-frame-duration) steps(1, end) var(--art-frame-delay) infinite; }
    .art-motion > .art-motion-frame-c { animation: art-frame-c var(--art-frame-duration) steps(1, end) var(--art-frame-delay) infinite; }
    .art-motion::before,
    .art-motion::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }
    .art-motion::before {
      inset: 0;
      z-index: 2;
      background: repeating-linear-gradient(0deg, transparent 0 5px, #dbeaff 5px 6px);
      background-position: 0 0;
      opacity: 0;
      animation: art-scan-drift 10s linear infinite;
    }
    .art-motion::after {
      top: -32%;
      right: 0;
      left: 0;
      z-index: 3;
      height: 28%;
      background: linear-gradient(180deg, transparent, #9dc5ff1a 44%, #ffffff14 55%, transparent);
      opacity: 0;
      transform: translateY(0);
      animation: art-signal-sweep var(--art-sweep-duration) ease-in-out infinite;
    }
    .art-motion--signal {
      --art-frame-duration: 5.4s;
      --art-frame-delay: -.9s;
      --art-sweep-duration: 9s;
      animation: art-signal-breathe 9s steps(12, end) infinite;
    }
    .art-motion--glitch {
      --art-frame-duration: 4s;
      --art-frame-delay: -.6s;
      --art-sweep-duration: 11s;
    }
    .art-motion--glitch > .art-motion-image:not(.art-motion-frame-b):not(.art-motion-frame-c) { animation: art-pixel-jitter 10s steps(1, end) infinite; }
    .art-motion--archive {
      --art-frame-duration: 5.2s;
      --art-frame-delay: -1.1s;
      --art-sweep-duration: 12s;
    }
    .art-motion--archive::after { opacity: 0; animation: none; }
    .art-motion--outcome {
      --art-frame-duration: 5.2s;
      --art-frame-delay: 480ms;
      --art-sweep-duration: 10s;
      animation: art-outcome-reveal 480ms steps(6, end) both;
    }
    .art-motion--ambient { --art-frame-duration: 6s; }
    .art-motion--interface { --art-frame-duration: 2.8s; }
    .art-motion--breath { --art-frame-duration: 5.2s; }

    @keyframes art-scan-drift {
      to { background-position: 0 12px; }
    }
    @keyframes art-frame-b {
      0%, 19%, 40%, 59%, 80%, 100% { opacity: 0; }
      20%, 39%, 60%, 79% { opacity: 1; }
    }
    @keyframes art-frame-c {
      0%, 39%, 60%, 100% { opacity: 0; }
      40%, 59% { opacity: 1; }
    }
    @keyframes art-signal-sweep {
      0%, 100% { opacity: 0; transform: translateY(0); }
    }
    @keyframes art-signal-breathe {
      0%, 50%, 100% { filter: brightness(1); }
    }
    @keyframes art-pixel-jitter {
      0%, 100% { transform: translateX(0); }
    }
    @keyframes art-outcome-reveal {
      from { opacity: .72; clip-path: inset(0 0 100% 0); }
      to { opacity: 1; clip-path: inset(0); }
    }

    .viral-still {
      position: relative;
      display: block;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid #505964;
      background-color: #0b1017;
    }
    .viral-still-image { display: block; width: 100%; height: 100%; object-fit: contain; background: #030507; }

    /* P02 */
    .mail-layout {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 16px;
    }

    .mail-sidebar, .mail-reader { border: 1px solid #737a84; background: #070a0e; }
    .mail-sidebar { align-self: start; }
    .panel-title { padding: 12px 16px; border-bottom: 1px solid #6d7480; color: var(--blue-pale); background: #07142c; }
    .folder-list { padding: 0; margin: 0; list-style: none; }
    .folder-item { display: flex; align-items: center; gap: 11px; min-height: 43px; padding: 8px 16px; color: #bdc1c8; }
    .folder-item.active { color: white; background: #23468b; }
    .inbox-preview { border-top: 1px solid #69717d; }
    .mail-preview { padding: 11px 16px; border-bottom: 1px solid #333943; color: #b8bdc7; }
    .mail-preview.active { background: #132d69; color: white; }
    .mail-preview strong, .mail-preview span { display: block; }
    .mail-preview span { margin-top: 4px; color: #aeb9cd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .mail-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 14px;
      border-bottom: 1px solid #707781;
    }

    .mail-message { margin: 14px; border: 1px solid #626a74; background: #0a0e13; }
    .mail-headers { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 7px 14px; padding: 16px; border-bottom: 1px dotted #727984; color: #c2c7cf; }
    .mail-headers dt { color: #9099a7; }
    .mail-headers dd { min-width: 0; margin: 0; overflow-wrap: anywhere; }
    .mail-body { padding: 22px; color: #d0d3d8; font-family: var(--sans); font-size: 16px; line-height: 1.55; }
    .mail-body p { margin: 0 0 16px; }
    .mail-body .signature { font-family: var(--mono); }
    .attachment {
      display: grid;
      gap: 12px;
      margin-top: 24px;
      padding: 12px;
      border: 1px solid #485469;
      background: #071226;
    }
    .attachment-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .attachment-art-label { color: var(--blue-pale); font-family: var(--mono); font-size: 12px; }
    .attachment-art {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 1px solid #455570;
      background: #000;
      object-fit: contain;
    }

    .reply-box { margin: 0 14px 14px; padding: 16px; border: 1px solid #4a5870; background: #09111d; }
    .reply-box h3 { margin: 0 0 12px; color: var(--blue-pale); font-size: 15px; }
    .reply-option { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 9px 0; color: #cbd0d8; cursor: pointer; }
    .reply-option input { accent-color: var(--blue-strong); }
    .reply-actions { display: flex; gap: 8px; margin-top: 12px; }
    .saved-status { color: var(--green); }

    /* P03 */
    .feed-layout { display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 26px; }
    .viral-post { border: 1px solid #777e89; background: #05070a; }
    .post-account {
      min-height: 66px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid #7a8089;
      background: #102452;
    }

    .avatar {
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid #a1a6ae;
      color: #07090c;
      background: #bbbdbf;
    }

    .avatar .icon { width: 30px; height: 30px; }
    .account-copy { min-width: 0; }
    .account-name { padding: 0; border: 0; color: #eef2fa; background: transparent; font-weight: 700; cursor: pointer; }
    .account-name:hover { color: var(--blue-pale); text-decoration: underline; }
    .new-account { display: inline-block; margin-left: 8px; padding: 3px 6px; border: 1px solid #788db9; color: #b6cbf8; font-size: 12px; }
    .post-time { display: block; margin-top: 4px; color: #b7bfce; font-size: 12px; }
    .post-follow { margin-left: auto; }
    .post-content { padding: 16px 18px; }
    .post-content h2 { margin: 0 0 10px; font-size: 21px; line-height: 1.25; }
    .post-copy { color: #ccd1d9; line-height: 1.55; }
    .feed-video { width: 100%; margin: 16px 0 12px; padding: 0; border: 1px solid #727985; background: #05080c; cursor: pointer; }
    .feed-video .viral-still { aspect-ratio: 16 / 7.7; }
    .feed-video:hover { border-color: var(--blue-pale); }
    .post-stats { display: flex; flex-wrap: wrap; gap: 18px; padding: 10px 0; border-bottom: 1px dotted #69717b; color: #c6cbd3; }
    .post-actions { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 14px; }

    .comments { margin-top: 14px; border: 1px solid #626975; background: #05070a; }
    .comments-head { display: flex; justify-content: space-between; gap: 12px; padding: 11px 14px; border-bottom: 1px solid #646b75; color: var(--blue-pale); background: #0e1f46; }
    .comment { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 12px; padding: 14px; border-bottom: 1px dashed #4f565f; }
    .comment:last-child { border-bottom: 0; }
    .comment.low-signal { border-left: 3px solid var(--yellow); background: #151204; }
    .comment .avatar { width: 38px; height: 38px; }
    .comment-meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; }
    .comment-meta strong { color: #e7eaf0; }
    .comment-meta time { color: #8f98a5; font-size: 12px; }
    .comment p { margin: 7px 0; color: #c5cad3; line-height: 1.5; }
    .comment-link { padding: 0; border: 0; color: var(--blue); background: transparent; cursor: pointer; }
    .comment-link:hover { color: var(--blue-pale); text-decoration: underline; }
    .side-stack { display: grid; align-content: start; gap: 20px; }
    .side-panel { border: 1px solid #737b87; background: #070a0e; }
    .side-panel-body { padding: 14px; color: #c5cad3; line-height: 1.5; }
    .message-card { display: grid; grid-template-columns: 44px 1fr; gap: 12px; }
    .message-card p { margin: 4px 0 10px; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag { color: var(--blue); }
    .next-step { border-color: #45679e; background: #08152d; }
    .next-step strong { display: block; margin-bottom: 8px; color: var(--blue-pale); }
    .next-step p { margin: 0 0 14px; }

    .media-static-badge {
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 4;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 9px;
      border: 1px solid #9ca7b7;
      color: #e9eef7;
      background: #02060ad9;
      font-size: 11px;
    }

    /* P04 */
    .search-lab {
      color-scheme: light;
      min-height: 570px;
      padding: 24px;
      border: 2px solid #b9bec5;
      color: #1b2430;
      background: #f6f6f2;
      box-shadow: var(--shadow);
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    .search-lab-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding-bottom: 18px;
      border-bottom: 1px solid #c6c9ce;
    }

    .search-lab-head div { display: flex; align-items: baseline; gap: 12px; }
    .search-lab-head strong { color: #123f89; font-family: Georgia, "Times New Roman", serif; font-size: 30px; }
    .search-lab-head span { color: #68717d; font-family: var(--mono); font-size: 12px; }

    /* P07 */
    .board-layout { display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 20px; align-items: start; }

    .ending-art-layer {
      position: fixed;
      inset: 0;
      z-index: 875;
      display: grid;
      place-items: center;
      padding: 32px;
      pointer-events: none;
    }

      width: min(960px, calc(100vw - 64px));

      overflow: auto;
      border: 1px solid #7c8ba0;
      color: #d9e1ec;
      background: #02060b;
      box-shadow: 0 24px 80px #000d, 0 0 0 1px #12386766, 0 0 42px #0b326855;
      pointer-events: auto;
      animation: outcome-window-in 220ms cubic-bezier(.2, .75, .2, 1) both;

    .ending-art-image { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #000; }

    @keyframes outcome-window-in {
      from { opacity: 0; transform: translateY(14px) scale(.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes outcome-window-out {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to { opacity: 0; transform: translateY(8px) scale(.98); }
    }

        }

    };

    let state = loadState();
    if (!localStorage.getItem(STORAGE_KEY) && (localStorage.getItem(STORAGE_KEY_V2) || localStorage.getItem(STORAGE_KEY_V1))) saveState();
    let activeModal = null;
    let lastFocus = null;
    let replyOpen = false;
    let expandedTraceNode = 'first-seen';
    let connectionStart = null;
    let selectedDecision = state.finalDecision;
    let endingArtOpen = false;
    let endingArtDecision = null;
    let endingArtReturnFocus = null;
    let endingArtCloseTimer = null;
    let connectionFrame = null;
    let renderToken = 0;
    let bootTimer = null;
    let toastTimer = null;
    let bgmUnlocked = Boolean(navigator.userActivation?.hasBeenActive);
    let activeBgmKey = null;
    const bgmFadeTokens = { glitch: 0, hardcore: 0 };

    const app = document.getElementById('app');
    const dialogBackdrop = document.getElementById('dialog-backdrop');
    const dialogTitle = document.getElementById('dialog-title');
    const dialogBody = document.getElementById('dialog-body');
    const dialogActions = document.getElementById('dialog-actions');
    const endingArtLayer = document.getElementById('ending-art-layer');
    const liveStatus = document.getElementById('live-status');

    function icon(name) {
      return `<svg class="icon" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
    }

    function loadState() {
      try {
        const rawV3 = JSON.parse(localStorage.getItem(STORAGE_KEY));
        const rawV2 = JSON.parse(localStorage.getItem(STORAGE_KEY_V2));
        const rawV1 = JSON.parse(localStorage.getItem(STORAGE_KEY_V1));
        const raw = rawV3?.version === 3 ? rawV3 : rawV2?.version === 2 ? rawV2 : rawV1?.version === 1 ? rawV1 : null;
        if (!raw) return { ...DEFAULT_STATE };
        const language = raw.language === 'zh' ? 'zh' : 'en';
        const currentScene = SCENES.includes(raw.currentScene) ? raw.currentScene : 'P00';
        const maxUnlockedScene = SCENES.includes(raw.maxUnlockedScene) ? raw.maxUnlockedScene : 'P00';
        const evidence = Array.isArray(raw.evidence) ? [...new Set(raw.evidence.filter(id => Object.hasOwn(EVIDENCE, id)))] : [];
        const selectedSearchQuery = ['maya', 'uploader', 'festival', 'headline', 'police'].includes(raw.selectedSearchQuery) ? raw.selectedSearchQuery : 'maya';
        const visitedQueries = Array.isArray(raw.visitedQueries)
          ? [...new Set(raw.visitedQueries.filter(id => ['maya', 'uploader', 'festival', 'headline', 'police'].includes(id)))]
          : [];
        const evidenceMarks = raw.evidenceMarks && typeof raw.evidenceMarks === 'object'
          ? Object.fromEntries(Object.entries(raw.evidenceMarks).filter(([id, mark]) => evidence.includes(id) && ['VERIFIED', 'UNVERIFIED', 'ALTERED', 'INFERRED'].includes(mark)))
          : {};
        const evidenceConnections = Array.isArray(raw.evidenceConnections)
          ? [...new Set(raw.evidenceConnections.filter(id => VALID_CONNECTIONS.includes(id)))]
          : [];
        const finalDecision = Object.hasOwn(ENDING_ART, raw.finalDecision) ? raw.finalDecision : null;
        return {
          ...DEFAULT_STATE,
          ...raw,
          version: 3,
          language,
          currentScene,
          maxUnlockedScene,
          evidence,
          replyChoice: raw.replyChoice === 0 || raw.replyChoice === 1 ? raw.replyChoice : null,
          replySent: Boolean(raw.replySent),
          openingSeen: Boolean(raw.openingSeen),
          selectedSearchQuery,
          visitedQueries,
          archiveRecordInspected: Boolean(raw.archiveRecordInspected),
          uploaderAnalysisOpened: Boolean(raw.uploaderAnalysisOpened),
          evidenceMarks,
          evidenceConnections,
          frameAnalysisInspected: Boolean(raw.frameAnalysisInspected),
          finalDecision,
          caseClosed: Boolean(raw.caseClosed),
          endingRevealed: Boolean(raw.endingRevealed),
          bgmEnabled: raw.bgmEnabled !== false
        };
      } catch (error) {
        return { ...DEFAULT_STATE };
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function sceneIndex(scene) { return SCENES.indexOf(scene); }

    function unlockScene(scene) {
      if (sceneIndex(scene) > sceneIndex(state.maxUnlockedScene)) state.maxUnlockedScene = scene;
    }

    function hasEvidence(id) { return state.evidence.includes(id); }

    function addEvidence(id) {
      if (!EVIDENCE[id] || hasEvidence(id)) return false;
      state.evidence = [...state.evidence, id];
      saveState();
      return true;
    }

    function hasCorrectMark(id) {
      return hasEvidence(id) && state.evidenceMarks[id] === CORRECT_EVIDENCE_MARKS[id];
    }

    function connectionId(first, second) {
      return [first, second].sort().join('-');
    }

    function getAnalysisStatus() {
      const correctCount = Object.keys(CORRECT_EVIDENCE_MARKS).filter(hasCorrectMark).length;
      const connectionCount = state.evidenceConnections.length;
      const hasProvenance = state.evidenceConnections.some(id => id === 'A-B' || id === 'B-F');
      const provenanceReady = hasCorrectMark('B') && hasProvenance;
      const level = correctCount >= 4 && connectionCount >= 2 && provenanceReady
        ? 'complete'
        : correctCount >= 4 && connectionCount >= 2
          ? 'partial'
          : 'insufficient';
      return { level, correctCount, connectionCount, hasProvenance, provenanceReady };
    }

    function suggestedInvestigationScene() {
      if (!hasEvidence('B')) return 'P04';
      if (!hasEvidence('A')) return 'P03';
      if (!hasEvidence('E')) return 'P02';
      if (!hasEvidence('C') || !hasEvidence('D')) return 'P06';
      return 'P07';
    }

    function copy() { return COPY[state.language]; }

    function renderMotionFrames(frameB, frameC, classNames, loading = 'lazy') {
      return `
        <img class="${escapeHTML(classNames)} art-motion-frame-b" src="${escapeHTML(frameB)}" alt="" aria-hidden="true" loading="${loading}" decoding="async">
        <img class="${escapeHTML(classNames)} art-motion-frame-c" src="${escapeHTML(frameC)}" alt="" aria-hidden="true" loading="${loading}" decoding="async">`;
    }

    function announce(message) {
      clearTimeout(toastTimer);
      liveStatus.textContent = message;
      liveStatus.classList.add('is-visible');
      toastTimer = setTimeout(() => liveStatus.classList.remove('is-visible'), 2600);
    }

    function updateEndingArtChrome() {
      const windowElement = endingArtLayer.querySelector('.ending-art-window');
      if (!windowElement) return;
      const t = copy().p08;
      const choice = t.choices.find(item => item.id === endingArtDecision);
      const title = document.getElementById('ending-art-title');
      const branch = document.getElementById('ending-art-branch');
      const image = endingArtLayer.querySelector('[data-ending-art]');
      const closeButton = document.getElementById('ending-art-close');
      const branchLabel = choice?.title || endingArtDecision;

      if (title) title.textContent = t.endingArtTitle;
      if (branch) branch.textContent = branchLabel;
      if (image) image.alt = `${t.endingArtAlt} ${branchLabel}`;
      if (closeButton) {
        closeButton.title = t.closeEndingArt;
        closeButton.setAttribute('aria-label', t.closeEndingArt);
      }
      windowElement.setAttribute('aria-label', `${t.endingArtTitle}: ${branchLabel}`);
    }

    function renderEndingArtWindow() {
      const validDecision = Object.hasOwn(ENDING_ART, endingArtDecision);
      if (!endingArtOpen || state.currentScene !== 'P08' || !validDecision) {
        if (!endingArtOpen) endingArtLayer.hidden = true;
        return;
      }

      const existingArt = endingArtLayer.querySelector('[data-ending-art]');
      if (!existingArt || existingArt.dataset.decision !== endingArtDecision || endingArtLayer.hidden) {
        endingArtLayer.innerHTML = `
          <section class="ending-art-window" role="region" aria-labelledby="ending-art-title">
            <header class="ending-art-head">
              <div class="ending-art-identity">
                <span class="ending-art-signal" aria-hidden="true"></span>
                <div class="ending-art-title">
                  <strong id="ending-art-title"></strong>
                  <span id="ending-art-branch"></span>
                </div>
              </div>
              <button id="ending-art-close" class="ending-art-tool" type="button" data-action="CLOSE_ENDING_ART">${icon('x')}</button>
            </header>
            <div class="ending-art-stage art-motion art-motion--outcome ${escapeHTML(ENDING_ART_MOTION_CLASS[endingArtDecision])}">
              <img class="ending-art-image art-motion-image" src="${escapeHTML(ENDING_ART[endingArtDecision])}" alt="" decoding="async" data-ending-art data-decision="${escapeHTML(endingArtDecision)}">
              ${renderMotionFrames(ENDING_ART_FRAME_B[endingArtDecision], ENDING_ART_FRAME_C[endingArtDecision], 'ending-art-image art-motion-image', 'eager')}
            </div>
          </section>`;
      }
      endingArtLayer.hidden = false;
      updateEndingArtChrome();
    }

    function openEndingArt(decision) {
      if (state.currentScene !== 'P08' || !Object.hasOwn(ENDING_ART, decision)) return;
      clearTimeout(endingArtCloseTimer);
      endingArtReturnFocus = document.activeElement instanceof HTMLElement && document.activeElement !== document.body
        ? document.activeElement
        : null;
      endingArtOpen = true;
      endingArtDecision = decision;
      renderEndingArtWindow();
      requestAnimationFrame(() => document.getElementById('ending-art-close')?.focus());
    }

    function closeEndingArt({ restoreFocus = true, animate = true } = {}) {
      const windowElement = endingArtLayer.querySelector('.ending-art-window');
      if (!endingArtOpen && !windowElement) return;
      clearTimeout(endingArtCloseTimer);
      endingArtOpen = false;

      const finish = () => {
        endingArtLayer.hidden = true;
        endingArtLayer.innerHTML = '';
        endingArtDecision = null;
        if (restoreFocus) {
          const target = endingArtReturnFocus instanceof HTMLElement && document.contains(endingArtReturnFocus)
            ? endingArtReturnFocus
            : document.querySelector('[data-action="OPEN_ENDING_ART"]');
          target?.focus();
        }
        endingArtReturnFocus = null;
      };

      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!animate || reduced || !windowElement) {
        finish();
        return;
      }
      windowElement.classList.add('is-closing');
      endingArtCloseTimer = setTimeout(finish, 170);
    }

    function dispatch(action, payload = {}) {
      switch (action) {
        case 'NAVIGATE': {
          const target = payload.scene;
          if (!SCENES.includes(target) || sceneIndex(target) > sceneIndex(state.maxUnlockedScene)) return;
          state.currentScene = target;
          if (target === 'P01') state.openingSeen = true;
          saveState();
          closeModal(false);
          render(true);
          break;
        }
        case 'ENTER_SYSTEM':
          unlockScene('P01');
          state.currentScene = 'P01';
          state.openingSeen = true;
          saveState();
          render(true);
          break;
        case 'START_CASE':
          unlockScene('P02');
          state.currentScene = 'P02';

          // Start heartbeat directly from user's click
          startMailHeartbeatOnce();

          saveState();
          render(true);
          break;
        case 'OPEN_POST':
          unlockScene('P03');
          state.currentScene = 'P03';
          saveState();
          render(true);
          break;
        case 'TOGGLE_LANGUAGE':
          state.language = state.language === 'en' ? 'zh' : 'en';
          saveState();
          render(false);
          announce(state.language === 'en' ? 'Language switched to English.' : '语言已切换至中文。');
          break;
        case 'TOGGLE_BGM': {
          state.bgmEnabled = !state.bgmEnabled;
          bgmUnlocked = true;
          saveState();
          syncBackgroundMusic();
          updateBgmButtons();
          announce(state.bgmEnabled ? copy().global.musicEnabled : copy().global.musicDisabled);
          break;
        }
        case 'OPEN_REPLY':
          replyOpen = true;
          render(false);
          requestAnimationFrame(() => document.querySelector('input[name="reply-choice"]')?.focus());
          break;
        case 'CANCEL_REPLY':
          replyOpen = false;
          render(false);
          break;
        case 'SELECT_REPLY':
          state.replyChoice = Number(payload.choice);
          saveState();
          render(false);
          break;
        case 'SEND_REPLY':
          if (state.replyChoice !== 0 && state.replyChoice !== 1) return;
          state.replySent = true;
          replyOpen = false;
          saveState();
          openModal({ title: copy().p02.reply, body: copy().p02.replySent });
          break;
        case 'SAVE_EVIDENCE': {
          if (payload.id === 'B' && !state.archiveRecordInspected) return;
          if (payload.id === 'C' && !state.uploaderAnalysisOpened) return;
          if (payload.id === 'F' && !state.frameAnalysisInspected) return;
          const added = addEvidence(payload.id);
          const messages = {
            A: copy().p03.evidenceSaved,
            B: copy().p05.evidenceSaved,
            C: copy().p06.accountSaved,
            D: copy().p06.timelineSaved,
            E: copy().p02.evidenceSaved,
            F: copy().p07.saveFSuccess
          };
          const message = messages[payload.id] || copy().modal.evidenceTitle;
          if (payload.id === 'B') unlockScene('P06');
          saveState();
          render(false);
          openModal({ title: copy().modal.evidenceTitle, body: message });
          if (added) announce(message);
          break;
        }
        case 'SHOW_VIDEO_NOTICE':
          openModal({ title: copy().modal.videoTitle, body: copy().modal.videoBody });
          break;
        case 'SHOW_ACCOUNT':
          openModal({ title: copy().modal.accountTitle, body: copy().modal.accountBody });
          break;
        case 'SHOW_SKEPTIC':
          openModal({ title: copy().modal.skepticTitle, body: copy().modal.skepticBody });
          break;
        case 'SHOW_ARIA':
          openModal({ title: copy().modal.ariaTitle, body: copy().modal.ariaBody });
          break;
        case 'REPORT_POST':
          openModal({ title: copy().modal.reportTitle, body: copy().modal.reportBody });
          break;
        case 'SHARE_POST':
          openModal({ title: copy().modal.shareTitle, body: copy().modal.shareBody });
          break;
        case 'UNLOCK_SEARCH':
          unlockScene('P04');
          state.currentScene = 'P04';
          if (!state.visitedQueries.includes(state.selectedSearchQuery)) state.visitedQueries = [...state.visitedQueries, state.selectedSearchQuery];
          saveState();
          render(true);
          break;
        case 'SELECT_SEARCH_QUERY': {
          const query = copy().p04.queries.find(item => item.id === payload.query);
          if (!query) return;
          state.selectedSearchQuery = query.id;
          if (!state.visitedQueries.includes(query.id)) state.visitedQueries = [...state.visitedQueries, query.id];
          saveState();
          render(false);
          requestAnimationFrame(() => document.getElementById('search-result-title')?.focus());
          break;
        }
        case 'OPEN_SEARCH_RESULT': {
          const result = copy().p04.queries.find(item => item.id === payload.query);
          if (!result) return;
          if (!state.visitedQueries.includes(result.id)) state.visitedQueries = [...state.visitedQueries, result.id];
          if (result.key) {
            unlockScene('P05');
            state.currentScene = 'P05';
            saveState();
            render(true);
          } else {
            saveState();
            openModal({ title: result.detailTitle, body: result.detailBody });
          }
          break;
        }
        case 'INSPECT_ARCHIVE':
          state.archiveRecordInspected = true;
          saveState();
          render(false);
          requestAnimationFrame(() => document.getElementById('source-match')?.focus());
          break;
        case 'OPEN_SOURCE_TRACE':
          if (!state.archiveRecordInspected || !hasEvidence('B')) {
            openModal({ title: copy().modal.archiveLockedTitle, body: copy().modal.archiveLockedBody });
            return;
          }
          unlockScene('P06');
          state.currentScene = 'P06';
          saveState();
          render(true);
          break;
        case 'TOGGLE_TRACE_NODE':
          expandedTraceNode = expandedTraceNode === payload.node ? null : payload.node;
          render(false);
          break;
        case 'OPEN_UPLOADER_ANALYSIS':
          state.uploaderAnalysisOpened = true;
          saveState();
          render(false);
          requestAnimationFrame(() => document.getElementById('uploader-analysis')?.focus());
          break;
        case 'UNLOCK_BOARD': {
          unlockScene('P07');
          state.currentScene = 'P07';
          saveState();
          render(true);
          announce(hasEvidence('C') && hasEvidence('D') ? copy().p06.checkpointComplete : copy().p06.checkpointPartial);
          break;
        }
        case 'MARK_EVIDENCE': {
          const id = payload.id;
          if (!hasEvidence(id) || !CORRECT_EVIDENCE_MARKS[id]) return;
          if (payload.mark !== CORRECT_EVIDENCE_MARKS[id]) {
            openModal({ title: copy().p07.wrongTitle, body: copy().p07.wrongBody });
            return;
          }
          state.evidenceMarks = { ...state.evidenceMarks, [id]: payload.mark };
          saveState();
          render(false);
          announce(`${copy().p07.correct}: ${id}`);
          break;
        }
        case 'CONNECT_EVIDENCE': {
          const id = payload.id;
          if (!hasCorrectMark(id)) {
            openModal({ title: copy().p07.connectionInvalidTitle, body: copy().p07.connectionNeedsMark });
            return;
          }
          if (!connectionStart) {
            connectionStart = id;
            render(false);
            announce(copy().p07.connectionPrompt);
            return;
          }
          if (connectionStart === id) {
            connectionStart = null;
            render(false);
            return;
          }
          const relation = connectionId(connectionStart, id);
          connectionStart = null;
          if (!VALID_CONNECTIONS.includes(relation)) {
            render(false);
            openModal({ title: copy().p07.connectionInvalidTitle, body: copy().p07.connectionInvalid });
            return;
          }
          if (!state.evidenceConnections.includes(relation)) state.evidenceConnections = [...state.evidenceConnections, relation];
          saveState();
          render(false);
          announce(copy().p07.relationLabels[relation]);
          break;
        }
        case 'INSPECT_FRAME_ANALYSIS':
          state.frameAnalysisInspected = true;
          saveState();
          render(false);
          requestAnimationFrame(() => document.getElementById('analysis-record')?.focus());
          break;
        case 'CONTINUE_INVESTIGATION': {
          const target = suggestedInvestigationScene();
          state.currentScene = target;
          saveState();
          render(true);
          break;
        }
        case 'OPEN_DECISION':
          if (getAnalysisStatus().level !== 'complete') {
            openModal({
              title: copy().p07.incompleteTitle,
              body: copy().p07.incompleteBody,
              actions: [
                { label: copy().global.cancel, action: 'CLOSE_MODAL', className: 'secondary-button' },
                { label: copy().p07.incompleteConfirm, action: 'CONFIRM_INCOMPLETE_DECISION', className: 'primary-button' }
              ]
            });
            return;
          }
          unlockScene('P08');
          state.currentScene = 'P08';
          saveState();
          render(true);
          break;
        case 'CONFIRM_INCOMPLETE_DECISION':
          unlockScene('P08');
          state.currentScene = 'P08';
          closeModal(false);
          saveState();
          render(true);
          break;
        case 'SELECT_DECISION':
          if (!Object.hasOwn(ENDING_ART, payload.decision)) return;
          if (payload.decision === 'FLAG_MANIPULATED' && getAnalysisStatus().level !== 'complete') return;
          selectedDecision = payload.decision;
          render(false);
          requestAnimationFrame(() => document.getElementById('decision-preview')?.focus());
          break;
        case 'SUBMIT_DECISION':
          if (!Object.hasOwn(ENDING_ART, selectedDecision)) return;
          if (selectedDecision === 'FLAG_MANIPULATED' && getAnalysisStatus().level !== 'complete') return;
          state.finalDecision = selectedDecision;
          saveState();
          render(false);
          openEndingArt(state.finalDecision);
          break;
        case 'OPEN_ENDING_ART':
          if (!state.finalDecision) return;
          openEndingArt(state.finalDecision);
          break;
        case 'CLOSE_ENDING_ART':
          closeEndingArt();
          break;
        case 'RESELECT_DECISION':
          closeEndingArt({ restoreFocus: false, animate: false });
          selectedDecision = null;
          render(false);
          requestAnimationFrame(() => document.querySelector('[data-action="SELECT_DECISION"]')?.focus());
          break;
        case 'CLOSE_CASE':
          if (!state.finalDecision) return;
          closeEndingArt({ restoreFocus: false, animate: false });
          unlockScene('P09');
          state.currentScene = 'P09';
          state.caseClosed = true;
          state.endingRevealed = false;
          saveState();
          render(true);
          break;
        case 'REVEAL_ENDING':
          state.endingRevealed = true;
          saveState();
          render(false);
          requestAnimationFrame(() => document.getElementById('ending-final')?.focus());
          break;
        case 'RETURN_TRACE':
          state.currentScene = 'P01';
          state.openingSeen = true;
          saveState();
          render(true);
          break;
        case 'REVIEW_CASE':
          state.currentScene = 'P07';
          saveState();
          render(true);
          break;
        case 'OPEN_RESET':
          openModal({
            title: copy().modal.resetTitle,
            body: copy().modal.resetBody,
            actions: [
              { label: copy().global.cancel, action: 'CLOSE_MODAL', className: 'secondary-button' },
              { label: copy().modal.resetConfirm, action: 'CONFIRM_RESET', className: 'danger-button' }
            ]
          });
          break;
        case 'CONFIRM_RESET':
          localStorage.removeItem(STORAGE_KEY);
          localStorage.removeItem(STORAGE_KEY_V2);
          localStorage.removeItem(STORAGE_KEY_V1);
          state = { ...DEFAULT_STATE };
          replyOpen = false;
          expandedTraceNode = 'first-seen';
          connectionStart = null;
          selectedDecision = null;
          closeEndingArt({ restoreFocus: false, animate: false });
          closeModal(false);
          render(true);
          break;
        case 'CLOSE_MODAL':
          closeModal(true);
          break;
      }
    }

    function openModal(config) {
      closeEndingArt({ restoreFocus: false, animate: false });
      lastFocus = document.activeElement;
      activeModal = config;
      app.inert = true;
      app.setAttribute('aria-hidden', 'true');
      renderModal();
      requestAnimationFrame(() => document.getElementById('dialog-close').focus());
    }

    function closeModal(restoreFocus = true) {
      if (!activeModal) return;
      activeModal = null;
      app.inert = false;
      app.removeAttribute('aria-hidden');
      dialogBackdrop.hidden = true;

      dialogActions.innerHTML = '';
      if (restoreFocus && lastFocus instanceof HTMLElement && document.contains(lastFocus)) lastFocus.focus();
    }

    const backgroundMusic = Object.fromEntries(Object.entries(BGM_TRACKS).map(([key, source]) => {
      const audio = new Audio(`./${source}`);
      audio.preload = 'auto';
      audio.loop = true;
      audio.volume = 0;
      return [key, audio];
    }));

    function stopBgmFade(key) {
      bgmFadeTokens[key] += 1;
    }

    function fadeBackgroundMusic(key, targetVolume, duration = 600, pauseWhenSilent = false) {
      const audio = backgroundMusic[key];
      if (!audio) return;
      const token = ++bgmFadeTokens[key];
      const startVolume = audio.volume;
      const startedAt = performance.now();
      const target = Math.max(0, Math.min(1, targetVolume));

      if (target > 0 && audio.paused) {
        audio.play().catch(() => {
          if (token === bgmFadeTokens[key]) audio.volume = 0;
        });
      }

      const step = now => {
        if (token !== bgmFadeTokens[key]) return;
        const progress = duration <= 0 ? 1 : Math.max(0, Math.min(1, (now - startedAt) / duration));
        audio.volume = startVolume + (target - startVolume) * progress;
        if (progress < 1) {
          requestAnimationFrame(step);
          return;
        }
        audio.volume = target;
        if (pauseWhenSilent && target === 0) audio.pause();
      };
      requestAnimationFrame(step);
    }

    function pauseAllBackgroundMusic() {
      Object.entries(backgroundMusic).forEach(([key, audio]) => {
        stopBgmFade(key);
        audio.pause();
        audio.volume = 0;
      });
    }

    function syncBackgroundMusic({ restart = false } = {}) {
      const config = SCENE_BGM[state.currentScene];
      if (!config) {
        pauseAllBackgroundMusic();
        activeBgmKey = null;
        return;
      }

      if (!state.bgmEnabled || !bgmUnlocked || document.hidden) {
        Object.keys(backgroundMusic).forEach(key => fadeBackgroundMusic(key, 0, 400, true));
        return;
      }

      const changedTrack = activeBgmKey !== config.track;
      Object.keys(backgroundMusic).forEach(key => {
        if (key !== config.track) fadeBackgroundMusic(key, 0, 600, true);
      });

      const targetAudio = backgroundMusic[config.track];
      if (changedTrack || restart) {
        stopBgmFade(config.track);
        targetAudio.pause();
        targetAudio.currentTime = 0;
        targetAudio.volume = 0;
      }
      activeBgmKey = config.track;
      fadeBackgroundMusic(config.track, config.volume, changedTrack || restart ? 600 : 300);
    }

    function unlockBackgroundMusic() {
      bgmUnlocked = true;

    }

    function startMailHeartbeatOnce() {
      if (mailHeartbeatPlayed) return;

    function drawEvidenceConnections() {
      cancelAnimationFrame(connectionFrame);
      connectionFrame = requestAnimationFrame(() => {
        if (state.currentScene !== 'P07' || window.matchMedia('(max-width: 560px)').matches) return;
        const stage = document.querySelector('.evidence-board-stage');
        const overlay = document.getElementById('connection-overlay');
        if (!stage || !overlay) return;
        const stageRect = stage.getBoundingClientRect();
        overlay.setAttribute('viewBox', `0 0 ${stageRect.width} ${stageRect.height}`);
        overlay.replaceChildren();
        state.evidenceConnections.forEach(id => {
          const [first, second] = id.split('-').map(cardId => document.getElementById(`evidence-card-${cardId}`));
          if (!first || !second) return;
          const firstRect = first.getBoundingClientRect();
          const secondRect = second.getBoundingClientRect();
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', firstRect.left - stageRect.left + firstRect.width / 2);
          line.setAttribute('y1', firstRect.top - stageRect.top + firstRect.height / 2);
          line.setAttribute('x2', secondRect.left - stageRect.left + secondRect.width / 2);
          line.setAttribute('y2', secondRect.top - stageRect.top + secondRect.height / 2);
          overlay.append(line);
        });
      });
    }

      renderToken += 1;
      const renderer = RENDERERS[state.currentScene] || renderP00;

      app.innerHTML = renderer();
      renderModal();
      renderEndingArtWindow();
      if (state.currentScene === 'P00') {
        startBootSequence(renderToken);
      }
      if (state.currentScene === 'P07') drawEvidenceConnections();

      if (state.currentScene !== 'P02') {
        stopMailHeartbeat();
      }
      syncBackgroundMusic();

      if (moveFocus) {

          document.getElementById('scene-title')?.focus({ preventScroll: true })

    function startBootSequence(token) {
      const target = document.getElementById('boot-copy');
      const action = document.getElementById('boot-action');

      if (!target || !action) return;

      const text = copy().p00.text;
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (state.openingSeen || reduced) {
        stopTypingSound();
        target.innerHTML = `${escapeHTML(text)}<span class="cursor"></span>`;
        action.hidden = false;
        return;
      }

      if (!reduced && !navigator.userActivation?.hasBeenActive) {
        target.innerHTML = `${escapeHTML(copy().p00.initialize)}<span class="cursor"></span>`;
        action.hidden = true;

        document.addEventListener('pointerdown', () => {
          target.innerHTML = '';
          startBootSequence(token);
        }, { once: true });

        return;
      }

      let index = 0;

      // Start typing sound
      typingSound.currentTime = 0;
      typingSound.play().catch(() => {});

      const step = () => {
        if (token !== renderToken || !document.contains(target)) {
          stopTypingSound();
          return;
        }

        index += 1;

        target.innerHTML =
          `${escapeHTML(text.slice(0, index))}<span class="cursor"></span>`;

        if (index < text.length) {
          const delay = text[index - 1] === '\n' ? 42 : 11;
          bootTimer = setTimeout(step, delay);
        } else {
          // Text finished -> stop typing sound
          stopTypingSound();
          action.hidden = false;
        }
      };

      step();
    }

    const buttonClickSound = new Audio('./materials/sound/effects/鼠标单击声.mp3');
    buttonClickSound.preload = 'auto';
    buttonClickSound.volume = 0.6;

    document.addEventListener('pointerdown', unlockBackgroundMusic, { passive: true });
    
    document.addEventListener('click', event => {
      // Play sound for every button click
      const button = event.target.closest('button');

      if (button && !button.disabled) {
        buttonClickSound.currentTime = 0;
        buttonClickSound.play().catch(() => {});
      }

      // Existing button/action logic
      const control = event.target.closest('[data-action]');
      if (!control) return;

      const action = control.dataset.action;
      if (action === 'SELECT_REPLY') return;

      dispatch(action, {
        scene: control.dataset.scene,
        id: control.dataset.evidence,
        choice: control.dataset.choice,
        query: control.dataset.query,
        node: control.dataset.node,
        mark: control.dataset.mark,
        decision: control.dataset.decision
      });
    });

    window.addEventListener('resize', () => {
      if (state.currentScene === 'P07') drawEvidenceConnections();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) pauseAllBackgroundMusic();
      else syncBackgroundMusic();
    });

    document.addEventListener('change', event => {
      const control = event.target.closest('[data-action="SELECT_REPLY"]');
      if (control) dispatch('SELECT_REPLY', { choice: control.dataset.choice });
    });

    document.addEventListener('submit', event => {
      if (!event.target.matches('[data-reply-form]')) return;
      event.preventDefault();
      dispatch('SEND_REPLY');
    });

    document.addEventListener('keydown', event => {
      if (!event.repeat) unlockBackgroundMusic();
      if (event.key === 'Escape') {
        if (activeModal) closeModal(true);
        else if (endingArtOpen) closeEndingArt();
      }
      if (event.key === 'Tab' && activeModal) {
        const focusable = [...dialogBackdrop.querySelectorAll('button:not([disabled])')];
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }
    });

    dialogBackdrop.addEventListener('mousedown', event => {
      if (event.target === dialogBackdrop) closeModal(true);
    });

    render(false);
  </script>
</body>
</html>
